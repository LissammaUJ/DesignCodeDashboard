@if (loading()) {
  <div class="kpi-grid" role="status" aria-label="Loading summary metrics">
    @for (i of [1, 2, 3, 4, 5, 6, 7, 8, 9]; track i) {
      <div class="kpi-card kpi-card--skeleton">
        <p-skeleton width="100%" height="110px" borderRadius="16px" />
      </div>
    }
  </div>
} @else {
  <div class="kpi-grid" role="list" aria-label="Dashboard KPI summary">
    @for (metric of metrics(); track metric.key) {
      <div
        class="kpi-card"
        role="listitem"
        [style.background]="metric.gradient"
        [attr.aria-label]="metric.label + ': ' + formatValue(metric)"
        [pTooltip]="metric.label + ': ' + formatValue(metric)"
        tooltipPosition="top"
      >
        <div class="kpi-card__top">
          <div class="kpi-card__icon" aria-hidden="true">
            <i [class]="metric.icon"></i>
          </div>
        </div>
        <div class="kpi-card__value">{{ formatValue(metric) }}</div>
        <div class="kpi-card__label">{{ metric.label }}</div>
      </div>
    }
  </div>
}
