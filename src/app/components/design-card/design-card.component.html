<article
  class="design-card-wrap"
  [style.animation-delay]="index() * 40 + 'ms'"
  (click)="onCardClick()"
  (keydown.enter)="onCardClick()"
  (keydown.space)="$event.preventDefault(); onCardClick()"
  tabindex="0"
  role="button"
  [attr.aria-label]="'View details for ' + design().designCode + ' — ' + (design().productName || design().designName)"
>
  <p-card styleClass="design-card">
    <ng-template #header>
      <div class="design-card__image">
        @if (design().imageUrl) {
          <img
            [src]="design().imageUrl"
            [alt]="design().designName"
            loading="lazy"
            decoding="async"
          />
        } @else {
          <div class="design-card__placeholder" aria-hidden="true">
            <i class="pi pi-image"></i>
            <span>No Image</span>
          </div>
        }
        <div class="design-card__badge">
          <p-tag
            [value]="design().approvalStatus"
            [severity]="getApprovalSeverity(design().approvalStatus)"
            [attr.aria-label]="'Status: ' + design().approvalStatus"
          />
        </div>
      </div>
    </ng-template>

    <div class="design-card__content">
      <header class="design-card__header">
        <h3 class="design-card__code">{{ design().designCode }}</h3>
        <p
          class="design-card__product"
          [pTooltip]="design().productName || 'No Data Available'"
          tooltipPosition="top"
        >
          {{ design().productName || 'No Data Available' }}
        </p>
      </header>

      <div class="design-card__kpis" role="group" aria-label="Business KPIs">
        @for (kpi of kpiItems(); track kpi.label) {
          <div
            class="kpi-tile"
            [class]="kpi.colorClass"
            [pTooltip]="kpi.tooltip"
            tooltipPosition="top"
            [attr.aria-label]="kpi.tooltip"
          >
            <div class="kpi-tile__top">
              <i class="kpi-tile__icon" [class]="kpi.icon" aria-hidden="true"></i>
              <span class="kpi-tile__label">{{ kpi.label }}</span>
            </div>
            <strong class="kpi-tile__value">{{ kpi.value }}</strong>
          </div>
        }
      </div>

      <div class="design-card__footer">
        <p-button
          label="View Details"
          icon="pi pi-eye"
          severity="success"
          styleClass="design-card__cta"
          [attr.aria-label]="'View details for ' + design().designCode"
          (onClick)="onViewDetails($event)"
        />
      </div>
    </div>
  </p-card>
</article>
