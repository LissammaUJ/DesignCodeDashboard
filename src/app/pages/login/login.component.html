<p-toast position="top-right" />

<div
  class="login-page"
  [class.login-page--light]="isLightTheme()"
  [class.login-page--dark]="isDarkTheme()"
>
  <div class="login-page__aurora" aria-hidden="true"></div>
  <div class="login-page__grid" aria-hidden="true"></div>

  <button
    type="button"
    class="login-page__theme-toggle"
    (click)="toggleTheme()"
    [attr.aria-label]="isDarkTheme() ? 'Switch to light mode' : 'Switch to dark mode'"
    pTooltip="Toggle theme"
    tooltipPosition="left"
  >
    <i [class]="isDarkTheme() ? 'pi pi-sun' : 'pi pi-moon'"></i>
  </button>

  <div class="login-page__content">
    <section class="login-card" role="main" aria-labelledby="login-title">
      <header class="login-card__header">
        <div class="login-card__mark" aria-hidden="true">
          <i class="pi pi-chart-bar"></i>
        </div>
        <h1 id="login-title" class="login-card__title">Design Code Dashboard</h1>
        <p class="login-card__subtitle">Secure access to the analytics platform</p>
      </header>

      <form class="login-card__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="login-field">
          <label for="companyId">Company</label>
          <p-select
            inputId="companyId"
            formControlName="companyId"
            [options]="companies()"
            optionLabel="coName"
            optionValue="coId"
            placeholder="Select company"
            [filter]="true"
            filterBy="coName"
            [loading]="companiesLoading()"
            styleClass="w-full login-select"
            appendTo="body"
          />
        </div>

        <div class="login-field">
          <label for="emplCode">Employee Code</label>
          <p-iconfield iconPosition="left" class="w-full">
            <p-inputicon styleClass="pi pi-user" />
            <input
              pInputText
              id="emplCode"
              formControlName="emplCode"
              autocomplete="username"
              placeholder="Employee code"
              class="w-full"
            />
          </p-iconfield>
        </div>

        <div class="login-field">
          <label for="password">Password</label>
          <p-password
            inputId="password"
            formControlName="password"
            [feedback]="false"
            [toggleMask]="true"
            styleClass="w-full"
            inputStyleClass="w-full"
            placeholder="Password"
            autocomplete="current-password"
          />
        </div>

        <div class="login-card__row">
          <div class="login-card__remember">
            <p-checkbox formControlName="rememberMe" [binary]="true" inputId="rememberMe" />
            <label for="rememberMe">Remember me</label>
          </div>
        </div>

        @if (error()) {
          <div class="login-card__alert" role="alert">{{ error() }}</div>
        }

        <p-button
          type="submit"
          label="Login"
          icon="pi pi-sign-in"
          styleClass="w-full login-card__submit"
          [loading]="loading()"
          [disabled]="loading() || companiesLoading()"
          ariaLabel="Login"
        />
      </form>
    </section>

    <footer class="login-page__footer">Version 1.0.0</footer>
  </div>

  @if (loading()) {
    <div class="login-overlay" role="status" aria-live="polite" aria-label="Authenticating">
      <div class="login-overlay__panel">
        <p-progressSpinner strokeWidth="3" [style]="{ width: '42px', height: '42px' }" />
        <p>Authenticating…</p>
      </div>
    </div>
  }
</div>
